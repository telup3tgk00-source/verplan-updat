<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Sedang Maintenance</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            max-width: 500px;
            border-top: 5px solid #0d2a5e; /* PLN Blue */
        }
        h1 { color: #0d2a5e; margin-bottom: 10px; }
        p { color: #64748b; line-height: 1.6; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f59e0b; /* PLN Yellow */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Sistem Sedang Diperbarui</h1>
        <p>Mohon maaf, <b>METRIK PLN</b> saat ini sedang dalam proses sinkronisasi dan peningkatan arsitektur untuk wilayah baru.</p>
        <p>Proses ini memakan waktu beberapa menit. Silakan kembali lagi nanti.</p>
        <br>
        <small style="color: #cbd5e1;">Tim IT & Verifikasi PLN</small>
    </div>
</body>
</html>
