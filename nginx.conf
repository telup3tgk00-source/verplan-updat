server {
    listen 80;
    server_name metrikpln.co.id www.metrikpln.co.id _;

    # Redirect HTTP ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name metrikpln.co.id www.metrikpln.co.id _;

    # Let's Encrypt certificates
    ssl_certificate /etc/letsencrypt/live/metrikpln.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metrikpln.co.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Izinkan upload file besar (default nginx hanya 1MB)
    client_max_body_size 200M;

    # ================= MAINTENANCE MODE =================
    # Jika ingin menonaktifkan maintenance, cukup beri komen (tanda #) pada 3 baris blok "if" di bawah.
    error_page 503 @maintenance;
    location @maintenance {
        root /usr/share/nginx/html;
        rewrite ^(.*)$ /maintenance.html break;
    }

    # Frontend
    location / {
        # KUNCI PINTU (Hanya untuk publik, Bos tetap bisa masuk)
        # if ($cookie_metrik_bypass != "buka_sesame") {
        #     return 503;
        # }

        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # === EXPORT EXCEL — timeout khusus untuk data ratusan ribu baris ===
    # Harus di atas blok /api/ agar Nginx match lebih spesifik dulu
    location /api/export/ {
        proxy_pass http://backend:8000/api/export/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Matikan buffering: Nginx langsung teruskan chunk ke client
        # tanpa menunggu seluruh file selesai → cegah timeout
        proxy_buffering off;
        proxy_request_buffering off;

        # 20 menit — cukup untuk build 300k rows XLSX
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_connect_timeout 120s;
    }

    # Backend Proxy
    location /api/ {
        # KUNCI PINTU (Jangan biarkan user lama nembak API diam-diam)
        # if ($cookie_metrik_bypass != "buka_sesame") {
        #     return 503;
        # }

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Handling CORS if needed (though backend handles it)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Waktu tunggu untuk upload file besar atau proxy ACMT
        proxy_read_timeout 300s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
    }
}
